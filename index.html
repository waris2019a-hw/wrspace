<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WRSpace by DE STC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,400;0,700;1,400&family=Prompt:wght@400;700&family=Kanit:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;height:100vh;display:flex;flex-direction:column;background:#eef0f4;color:#222;overflow:hidden}
button{font-family:inherit;cursor:pointer}
#topbar{height:52px;display:flex;align-items:center;gap:8px;padding:0 14px;background:linear-gradient(90deg,#00c4cc,#7d2ae8);color:#fff;z-index:30}
#topbar .logo{font-weight:700;font-size:18px;margin-right:10px}
#topbar button,#topbar .btn{background:rgba(255,255,255,.15);color:#fff;border:0;padding:7px 12px;border-radius:6px;font-size:14px;cursor:pointer;white-space:nowrap}
#topbar button:hover,#topbar .btn:hover{background:rgba(255,255,255,.3)}
#topbar .primary{background:#fff;color:#7d2ae8;font-weight:700}
#docTitle{background:transparent;border:1px solid transparent;color:#fff;font:inherit;font-size:15px;padding:5px 8px;border-radius:6px;width:220px}
#docTitle:hover,#docTitle:focus{border-color:rgba(255,255,255,.6);outline:0}
.spacer{flex:1}
.dropdown{position:relative}
.dropdown .menu{display:none;position:absolute;right:0;top:110%;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);min-width:190px;z-index:50;overflow:hidden;color:#222}
.dropdown.open .menu{display:block}
.dropdown .menu button{display:block;width:100%;text-align:left;background:#fff!important;color:#222!important;border-radius:0!important;padding:10px 14px!important}
.dropdown .menu button:hover{background:#f1ecfd!important}
.dropdown .menu button small{float:right;color:#999;margin-left:12px}
#sizeDD .menu{min-width:240px}
.custom-size{border-top:1px solid #eee;padding:10px 14px 12px}
.custom-size .cs-title{font-size:13px;color:#666;margin-bottom:6px}
.custom-size .cs-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.custom-size input{width:76px;padding:5px;border:1px solid #ccc;border-radius:5px;font-family:inherit}
#sizeDD .menu .cs-swap{width:auto!important;display:inline-block!important;padding:4px 8px!important;border:1px solid #ccc!important;border-radius:5px!important}
#sizeDD .menu .cs-apply{background:#7d2ae8!important;color:#fff!important;border-radius:6px!important;text-align:center!important;padding:7px!important}
#toolbar{height:46px;display:flex;align-items:center;gap:4px;padding:0 12px;background:#fff;border-bottom:1px solid #ddd;overflow-x:auto;z-index:10}
#toolbar button{border:0;background:transparent;padding:6px 10px;border-radius:6px;font-size:15px;white-space:nowrap}
#toolbar button:hover{background:#f0f0f5}
#toolbar button.on{background:#ede4fd;color:#7d2ae8;font-weight:700}
#toolbar input[type=color]{width:30px;height:28px;border:1px solid #ccc;border-radius:5px;padding:0;background:#fff;cursor:pointer}
#toolbar input[type=number]{width:52px;padding:4px;border:1px solid #ccc;border-radius:5px;font-family:inherit}
#toolbar .sep{width:1px;height:24px;background:#ddd;margin:0 6px}
#zoomLabel{font-size:13px;min-width:46px;text-align:center}
main{flex:1;display:flex;min-height:0}
#slides{width:190px;background:#fff;border-right:1px solid #ddd;overflow-y:auto;padding:12px;transition:width .2s,padding .2s;flex-shrink:0}
#slides.hidden{width:0;padding:0;overflow:hidden;border:0}
.thumb{position:relative;margin-bottom:12px;cursor:pointer}
.thumb img{width:100%;display:block;border:2px solid #ddd;border-radius:6px;background:#fff}
.thumb.active img{border-color:#7d2ae8}
.thumb .num{position:absolute;left:-4px;top:-6px;background:#7d2ae8;color:#fff;font-size:11px;border-radius:10px;padding:0 6px}
.thumb .acts{position:absolute;right:4px;top:4px;display:none;gap:2px}
.thumb:hover .acts{display:flex}
.thumb .acts button{border:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:4px;width:22px;height:22px}
#addSlide{width:100%;padding:10px;border:2px dashed #c9b6f5;background:#faf7ff;color:#7d2ae8;border-radius:6px;font-weight:700}
#stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:30px;position:relative}
#canvasWrap{box-shadow:0 4px 20px rgba(0,0,0,.15);background:#fff;margin:auto}
#props{width:270px;background:#fff;border-left:1px solid #ddd;overflow-y:auto;padding:14px;transition:width .2s,padding .2s;flex-shrink:0}
#props.hidden{width:0;padding:0;overflow:hidden;border:0}
#props h3{font-size:14px;margin:6px 0 10px;color:#555}
.row{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.row label{font-size:13px;color:#666;width:84px}
.row input[type=number],.row select{flex:1;min-width:60px;padding:5px;border:1px solid #ccc;border-radius:5px;font-family:inherit}
.row input[type=color]{width:40px;height:30px;border:1px solid #ccc;border-radius:5px;padding:0;background:#fff}
.row input[type=range]{flex:1}
.row button{border:1px solid #ccc;background:#fff;border-radius:5px;padding:5px 9px;min-width:32px}
.row button:hover{background:#f4f0fd}
.row button.on{background:#7d2ae8;color:#fff;border-color:#7d2ae8}
.hint{font-size:12px;color:#888;line-height:1.6}
.pen-note{background:#f4f0fd;color:#7d2ae8;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:12px}
.toggle-panel-btn{position:absolute;top:10px;background:#fff;border:1px solid #ccc;border-radius:4px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 2px 5px rgba(0,0,0,.1);font-size:12px;color:#555}
.toggle-panel-btn:hover{background:#f0f0f5}
#toggleLeftBtn{left:10px}
#toggleRightBtn{right:10px}
#present{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:100;cursor:pointer}
#present img{max-width:100vw;max-height:100vh}
#present .counter{position:absolute;bottom:12px;right:16px;color:#aaa;font-size:13px}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:200;font-size:16px}
#loading .spin{width:40px;height:40px;border:4px solid #ddd;border-top-color:#7d2ae8;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:250}
.modal-box{background:#fff;padding:24px;border-radius:12px;width:380px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.modal-box h3{margin-bottom:12px;font-size:16px;color:#333}
.modal-box input{width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:6px;font-size:14px;margin-bottom:16px;font-family:inherit}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.modal-actions button{padding:6px 14px;border-radius:6px;border:1px solid #ccc;background:#f5f5f5;font-size:14px}
.modal-actions button.primary{background:#7d2ae8;color:#fff;border-color:#7d2ae8}
</style>
</head>
<body>
<header id="topbar">
  <span class="logo">WRSpace by DE STC</span>
  <button id="btnNew">ใหม่</button>
  <label class="btn">เปิดไฟล์<input type="file" id="fileOpen" accept=".pptx,.ppsx,.pdf,.json,image/*" hidden></label>
  <label class="btn" title="ดึงข้อความจาก PDF ให้แก้ไขได้"><input type="checkbox" id="pdfEditable" checked> PDF แก้ข้อความได้</label>
  <input id="docTitle" value="งานนำเสนอไม่มีชื่อ">
  <div class="spacer"></div>
  <div class="dropdown" id="sizeDD">
    <button id="btnSize" title="ขนาดสไลด์">📐 <span id="sizeLabel">960×540</span> ▾</button>
    <div class="menu">
      <button data-size="960x540">แนวนอน 16:9 <small>960×540</small></button>
      <button data-size="540x960">แนวตั้ง 9:16 <small>540×960</small></button>
      <button data-size="960x720">แนวนอน 4:3 <small>960×720</small></button>
      <button data-size="720x960">แนวตั้ง 3:4 <small>720×960</small></button>
      <div class="custom-size">
        <div class="cs-title">กำหนดเอง (pixel)</div>
        <div class="cs-row">
          <input type="number" id="customW" min="50" max="5000" title="กว้าง">
          <span>×</span>
          <input type="number" id="customH" min="50" max="5000" title="สูง">
          <button class="cs-swap" id="swapSize" title="สลับกว้าง/สูง">⇄</button>
        </div>
        <button class="cs-apply" id="applySize">ใช้ขนาดนี้</button>
      </div>
    </div>
  </div>
  <button id="btnSave" title="Ctrl+S">บันทึกโปรเจกต์</button>
  <div class="dropdown" id="exportDD">
    <button id="btnExport">ดาวน์โหลด ▾</button>
    <div class="menu">
      <button data-exp="pptx">PowerPoint (.pptx)</button>
      <button data-exp="pdf">PDF</button>
      <button data-exp="png">PNG (สไลด์นี้)</button>
      <button data-exp="json">ไฟล์โปรเจกต์ (.json)</button>
    </div>
  </div>
  <button class="primary" id="btnPresent">▶ นำเสนอ</button>
</header>

<nav id="toolbar">
  <button data-add="heading"><b>หัวเรื่อง</b></button>
  <button data-add="subheading">หัวข้อรอง</button>
  <button data-add="body">ข้อความ</button>
  <span class="sep"></span>
  <button data-add="rect" title="สี่เหลี่ยม">▭</button>
  <button data-add="roundrect" title="สี่เหลี่ยมมุมมน">▢</button>
  <button data-add="circle" title="วงกลม">◯</button>
  <button data-add="triangle" title="สามเหลี่ยม">△</button>
  <button data-add="star" title="ดาว">☆</button>
  <button data-add="line" title="เส้น">╱</button>
  <button id="btnImage">รูปภาพ</button>
  <input type="file" id="imgInput" accept="image/*" multiple hidden>
  <button id="btnQR">QR Code</button>
  <span class="sep"></span>
  <button id="btnPen" title="ปากกา (Esc เพื่อออก)">✏️ ปากกา</button>
  <input type="color" id="penColor" value="#e63946" title="สีปากกา">
  <input type="number" id="penWidth" value="4" min="1" max="50" title="ความหนาเส้น (px)">
  <span class="sep"></span>
  <button id="btnUndo" title="Ctrl+Z">↶</button>
  <button id="btnRedo" title="Ctrl+Y">↷</button>
  <span class="sep"></span>
  <button id="btnZoomOut">−</button><span id="zoomLabel">100%</span><button id="btnZoomIn">+</button>
  <button id="btnFit">พอดีจอ</button>
</nav>

<main>
  <aside id="slides"><div id="slideList"></div><button id="addSlide">+ เพิ่มสไลด์</button></aside>
  <section id="stage">
    <button class="toggle-panel-btn" id="toggleLeftBtn" title="ซ่อน/แสดงแถบสไลด์">◀</button>
    <button class="toggle-panel-btn" id="toggleRightBtn" title="ซ่อน/แสดงแผงปรับแต่ง">▶</button>
    <div id="canvasWrap"><canvas id="c"></canvas></div>
  </section>
  <aside id="props"></aside>
</main>

<div class="modal-overlay" id="qrModal">
  <div class="modal-box">
    <h3>สร้าง QR Code</h3>
    <input type="text" id="qrInput" placeholder="https://example.com" />
    <div class="modal-actions">
      <button id="qrCancel">ยกเลิก</button>
      <button class="primary" id="qrSubmit">แทรก QR Code</button>
    </div>
  </div>
</div>

<div id="present"><img id="presentImg" alt=""><div class="counter" id="presentCounter"></div></div>
<div id="loading"><div class="spin"></div><div id="loadingText">กำลังโหลด...</div></div>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ===================== WRSpace (single file) ===================== */
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = s => document.querySelector(s);
const PROPS = ['name', 'selectable'];
const THAI = /[\u0E00-\u0E7F]/;
const FONTS = ['Sarabun', 'Prompt', 'Kanit', 'Noto Sans Thai', 'Arial', 'Tahoma', 'Georgia', 'Times New Roman', 'Courier New'];
const MIN_SIZE = 50, MAX_SIZE = 5000;
let W = 960, H = 540;
let slides = [], cur = 0, history = [], hIdx = -1, lock = false, zoom = 1, clipboard = null, dirty = false, penOn = false;

const canvas = new fabric.Canvas('c', { width: W, height: H, backgroundColor: '#ffffff', preserveObjectStacking: true });
fabric.Object.prototype.set({ transparentCorners: false, cornerColor: '#7d2ae8', cornerStyle: 'circle', borderColor: '#7d2ae8', cornerSize: 10 });

/* ---------- helpers ---------- */
const sleep0 = () => new Promise(r => setTimeout(r));
const showLoading = t => { $('#loadingText').textContent = t || 'กำลังโหลด...'; $('#loading').style.display = 'flex'; };
const hideLoading = () => { $('#loading').style.display = 'none'; };
const docName = () => ($('#docTitle').value || 'presentation').replace(/[\\/:*?"<>|]/g, '_');
const blankJSON = (bg = '#ffffff') => ({ version: fabric.version, objects: [], background: bg });
const isText = o => !!o && /text/.test(o.type);
const readAsDataURL = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
const loadImage = url => new Promise((res, rej) => fabric.Image.fromURL(url, (img, err) => (err || !img || !img.width) ? rej(new Error('โหลดรูปไม่ได้')) : res(img), { crossOrigin: 'anonymous' }));
function pickFile(accept, cb) { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => i.files[0] && cb(i.files[0]); i.click(); }
function toHex(c) { try { if (!c || typeof c !== 'string' || c === 'transparent') return '#000000'; return '#' + new fabric.Color(c).toHex(); } catch { return '#000000'; } }
function autoWrap(o) { if (o && o.type === 'textbox') { const v = THAI.test(o.text); if (o.splitByGrapheme !== v) { o.splitByGrapheme = v; o.initDimensions(); } } }
function fitDims(srcW, srcH, base = 960) {
  return srcW >= srcH ? { w: base, h: Math.round(base * srcH / srcW) } : { w: Math.round(base * srcW / srcH), h: base };
}

function dataURLtoBlob(u) {
  const [head, b64] = u.split(','), mime = head.match(/:(.*?);/)[1], bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function toast(msg, link, ms) {
  document.getElementById('ssToast')?.remove();
  const t = document.createElement('div'); t.id = 'ssToast';
  t.style.cssText = 'position:fixed;right:16px;bottom:16px;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:12px 16px;z-index:300;font-size:14px;max-width:360px;line-height:1.5';
  t.append(msg);
  if (link) {
    const a = document.createElement('a'); a.href = link.url; a.download = link.name;
    a.textContent = ' คลิกที่นี่'; a.style.cssText = 'color:#7d2ae8;font-weight:700'; t.append(a);
  }
  const x = document.createElement('button'); x.textContent = '✕';
  x.style.cssText = 'margin-left:10px;border:0;background:none;cursor:pointer'; x.onclick = () => t.remove(); t.append(x);
  document.body.append(t);
  setTimeout(() => t.remove(), ms || (link ? 60000 : 3000));
}
function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.append(a); a.click(); a.remove();
  toast(`กำลังดาวน์โหลด ${name} ถ้าไฟล์ไม่มา`, { url, name });
  setTimeout(() => URL.revokeObjectURL(url), 120000);
}
const download = (dataUrl, name) => saveBlob(dataURLtoBlob(dataUrl), name);

/* ---------- IndexedDB AutoSave ---------- */
const idb = (mode, fn) => new Promise((res, rej) => {
  const r = indexedDB.open('wrspace', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onerror = () => rej(r.error);
  r.onsuccess = () => {
    const tx = r.result.transaction('kv', mode), q = fn(tx.objectStore('kv'));
    tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error);
  };
});
const projectData = () => { saveCurrent(); return { app: 'wrspace', W, H, title: $('#docTitle').value, slides: slides.map(s => s.json), savedAt: Date.now() }; };
async function saveToBrowser(silent) {
  try {
    await idb('readwrite', s => s.put(projectData(), 'autosave'));
    dirty = false;
    if (!silent) toast('บันทึกงานไว้ในเบราว์เซอร์แล้ว ✓');
  } catch (e) {
    console.error(e);
    if (!silent) alert('บันทึกในเบราว์เซอร์ไม่ได้: ' + e.message);
  }
}
setInterval(() => { if (dirty) saveToBrowser(true); }, 5000);

function withStatic(json, fn) {
  return new Promise(res => {
    const sc = new fabric.StaticCanvas(document.createElement('canvas'), { width: W, height: H, enableRetinaScaling: false });
    sc.loadFromJSON(json, async () => { sc.renderAll(); const r = await fn(sc); sc.dispose(); res(r); });
  });
}
const renderJSON = (json, mult = 1, fmt = 'png') => withStatic(json, sc => sc.toDataURL({ format: fmt, quality: 0.9, multiplier: mult }));

/* ---------- zoom / size ---------- */
function applyZoom(z) {
  zoom = Math.max(0.05, Math.min(4, z));
  canvas.setZoom(zoom); canvas.setDimensions({ width: W * zoom, height: H * zoom });
  $('#zoomLabel').textContent = Math.round(zoom * 100) + '%';
}
function fitZoom() { const st = $('#stage'); applyZoom(Math.min((st.clientWidth - 60) / W, (st.clientHeight - 60) / H)); }
function setSize(w, h) {
  W = w; H = h;
  canvas.setDimensions({ width: W, height: H });
  fitZoom();
  $('#sizeLabel').textContent = `${W}×${H}`;
}
window.addEventListener('resize', fitZoom);
canvas.on('mouse:wheel', opt => { if (!opt.e.ctrlKey) return; applyZoom(zoom * 0.999 ** opt.e.deltaY); opt.e.preventDefault(); opt.e.stopPropagation(); });

// เปลี่ยนขนาดสไลด์ทุกหน้า: ย่อ/ขยายเนื้อหาตามสัดส่วนเดิมแล้ววางกึ่งกลาง
async function resizeSlides(nw, nh) {
  nw = Math.round(nw); nh = Math.round(nh);
  if (!(nw >= MIN_SIZE && nh >= MIN_SIZE && nw <= MAX_SIZE && nh <= MAX_SIZE)) {
    alert(`ขนาดต้องอยู่ระหว่าง ${MIN_SIZE}–${MAX_SIZE} px`); return;
  }
  if (nw === W && nh === H) return;
  saveCurrent(); canvas.discardActiveObject();
  const k = Math.min(nw / W, nh / H), dx = (nw - W * k) / 2, dy = (nh - H * k) / 2;
  const fit = o => {
    if (!o) return;
    o.left = (o.left || 0) * k + dx; o.top = (o.top || 0) * k + dy;
    o.scaleX = (o.scaleX || 1) * k; o.scaleY = (o.scaleY || 1) * k;
  };
  slides.forEach(s => { (s.json.objects || []).forEach(fit); fit(s.json.backgroundImage); });
  showLoading('กำลังปรับขนาดสไลด์...');
  try {
    setSize(nw, nh);
    for (let i = 0; i < slides.length; i++) slides[i].thumb = await renderJSON(slides[i].json, 180 / Math.max(W, H), 'jpeg');
    await gotoSlide(cur, true);
    dirty = true;
  } finally { hideLoading(); }
}

/* ---------- pencil ---------- */
function setPen(on) {
  penOn = on;
  canvas.isDrawingMode = on;
  if (on) {
    canvas.discardActiveObject();
    const b = new fabric.PencilBrush(canvas);
    b.color = $('#penColor').value;
    b.width = Math.max(1, +$('#penWidth').value || 4);
    b.decimate = 2;
    canvas.freeDrawingBrush = b;
  }
  $('#btnPen').classList.toggle('on', on);
  canvas.requestRenderAll(); updateProps();
}
canvas.on('path:created', e => { e.path.set({ strokeLineCap: 'round', strokeLineJoin: 'round' }); });

/* ---------- state / history ---------- */
const snapshot = () => canvas.toJSON(PROPS);
function saveCurrent() { if (slides[cur]) slides[cur].json = snapshot(); }
function updateThumb() {
  const s = slides[cur]; if (!s) return;
  s.thumb = canvas.toDataURL({ format: 'jpeg', quality: 0.7, multiplier: 180 / Math.max(W, H) / zoom });
  const img = document.querySelectorAll('#slideList .thumb img')[cur]; if (img) img.src = s.thumb;
}
function commit() {
  if (lock || !slides[cur]) return;
  const j = snapshot(); slides[cur].json = j;
  history = history.slice(0, hIdx + 1); history.push(JSON.stringify(j));
  if (history.length > 60) history.shift();
  hIdx = history.length - 1; updateThumb(); dirty = true;
}
function loadIntoCanvas(json) {
  return new Promise(res => { lock = true; canvas.discardActiveObject(); canvas.loadFromJSON(json, () => { canvas.renderAll(); lock = false; res(); }); });
}

    $('#loadingText').textContent = `กำลังอ่าน PDF หน้า ${n}/${pdf.numPages}`;
    const page = await pdf.getPage(n);
    const base = page.getViewport({ scale: 1 }), scale = Math.min(w / base.width, h / base.height);
    const vp = page.getViewport({ scale }), vpHi = page.getViewport({ scale: scale * R });
    const offX = (w - vp.width) / 2, offY = (h - vp.height) / 2;
    const full = await renderPdfPage(page, vpHi, false);
    let bgCanvas = full; const objs = [];
    if (editable) {
      const noText = await renderPdfPage(page, vpHi, true); bgCanvas = noText;
      const tc = await page.getTextContent();
      const A = full.getContext('2d').getImageData(0, 0, full.width, full.height).data;
      const B = noText.getContext('2d').getImageData(0, 0, noText.width, noText.height).data;
      for (const it of mergePdfItems(tc.items, vp)) {
        const fam = (tc.styles[it.font] || {}).fontFamily || '';
        let bold = false, italic = false;
        try { const f = page.commonObjs.get(it.font); const nm = (f && (f.name || f.loadedName)) || ''; bold = /bold|black|heavy|semibold/i.test(nm); italic = /italic|oblique/i.test(nm); } catch {}
        const fill = sampleColor(A, B, full.width, full.height, it.x * R, (it.y - it.fh) * R, it.w * R, it.fh * 1.25 * R);
        const t = new fabric.IText(it.str, {
          left: offX + it.x, top: offY + it.y - it.fh * 0.88, fontSize: it.fh, lineHeight: 1,
          fontFamily: /serif/i.test(fam) && !/sans/i.test(fam) ? 'Times New Roman' : 'Sarabun',
          fill, fontWeight: bold ? 'bold' : 'normal', fontStyle: italic ? 'italic' : 'normal',
        });
        if (t.width > 0 && it.w > 0) t.scaleX = Math.min(1.6, Math.max(0.6, it.w / t.width));
        if (Math.abs(it.angle) >= 1) t.set('angle', it.angle);
        objs.push(t);
      }
    }
    const bgImg = await loadImage(bgCanvas.toDataURL('image/jpeg', 0.88));
    bgImg.set({ left: offX, top: offY, scaleX: vp.width / bgImg.width, scaleY: vp.height / bgImg.height });
    const json = blankJSON('#ffffff');
    json.backgroundImage = bgImg.toObject();
    json.objects = objs.map(o => o.toObject(PROPS));
    out.push(json);
    await sleep0();
  }
  return { W: w, H: h, slides: out };
}

/* ===================== OPEN / SAVE ===================== */
async function openFile(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  if (f.type.startsWith('image/')) return addImageFile(f);
  if (['ppt', 'pps', 'odp'].includes(ext)) {
    alert('ไฟล์ .' + ext + ' แบบเก่าเปิดในเบราว์เซอร์โดยตรงไม่ได้\nกรุณาเปิดใน PowerPoint / LibreOffice / Google Slides แล้ว Save As เป็น .pptx หรือ .pdf ก่อนครับ');
    return;
  }
  try {
    if (penOn) setPen(false);
    showLoading('กำลังเปิด ' + f.name + ' ...');
    let result;
    if (ext === 'pptx' || ext === 'ppsx') result = await importPPTX(await f.arrayBuffer());
    else if (ext === 'pdf') result = await importPDF(await f.arrayBuffer(), $('#pdfEditable').checked);
    else if (ext === 'json') { const d = JSON.parse(await f.text()); result = { W: d.W || 960, H: d.H || 540, slides: d.slides }; }
    else throw new Error('ไม่รองรับไฟล์ชนิดนี้');
    await loadProject(result, f.name.replace(/\.[^.]+$/, ''));
  } catch (err) { console.error(err); alert('เปิดไฟล์ไม่สำเร็จ: ' + err.message); }
  finally { hideLoading(); }
}
async function loadProject({ W: w, H: h, slides: list }, title) {
  setSize(w || 960, h || 540);
  slides = (list && list.length ? list : [blankJSON()]).map(j => ({ json: j, thumb: '' }));
  if (title) $('#docTitle').value = title;
  for (let i = 0; i < slides.length; i++) {
    $('#loadingText').textContent = `สร้างภาพตัวอย่าง ${i + 1}/${slides.length}`;
    slides[i].thumb = await renderJSON(slides[i].json, 180 / Math.max(W, H), 'jpeg');
  }
  cur = 0; await gotoSlide(0, true);
}
async function saveProject() { await saveToBrowser(false); }
function downloadProject() {
  saveBlob(new Blob([JSON.stringify(projectData())], { type: 'application/json' }), docName() + '.json');
}

/* ===================== EXPORT ===================== */
const PX2IN = 1 / 96;
function hexA(c) { try { const col = new fabric.Color(c); return { color: col.toHex(), alpha: col.getAlpha() }; } catch { return { color: '000000', alpha: 1 }; } }
function imgSrc(o) {
  const el = o.getElement(), nw = el.naturalWidth || el.width, nh = el.naturalHeight || el.height;
  const cropped = o.cropX || o.cropY || Math.round(o.width) !== nw || Math.round(o.height) !== nh;
  const s = o.getSrc && o.getSrc();
  if (!cropped && s && s.startsWith('data:')) return s;
  const c = document.createElement('canvas'); c.width = o.width; c.height = o.height;
  c.getContext('2d').drawImage(el, o.cropX || 0, o.cropY || 0, o.width, o.height, 0, 0, o.width, o.height);
  return c.toDataURL('image/png');
}
function boxOf(o) {
  const c = o.getCenterPoint(), w = o.getScaledWidth(), h = o.getScaledHeight();
  return { x: (c.x - w / 2) * PX2IN, y: (c.y - h / 2) * PX2IN, w: w * PX2IN, h: h * PX2IN, rotate: o.angle || 0 };
}
function runOpts(o, st = {}) {
  const g = k => st[k] !== undefined ? st[k] : o[k], fw = g('fontWeight');
  const opt = { fontFace: g('fontFamily'), fontSize: Math.round(g('fontSize') * o.scaleY * 0.75 * 10) / 10, color: hexA(g('fill') || '#000').color,
    bold: fw === 'bold' || +fw >= 600, italic: g('fontStyle') === 'italic' };
  if (g('underline')) opt.underline = { style: 'sng' };
  return opt;
}
function textRuns(o) {
  const lines = o.text.split('\n'), runs = [];
  lines.forEach((ln, li) => {
    const start = runs.length; let buf = '', key = null, st = {};
    const flush = () => { if (buf) runs.push({ text: buf, options: runOpts(o, st) }); buf = ''; };
    fabric.util.string.graphemeSplit(ln).forEach((ch, ci) => {
      const s = (o.styles && o.styles[li] && o.styles[li][ci]) || {}, k = JSON.stringify(s);
      if (k !== key) { flush(); key = k; st = s; } buf += ch;
    });
    flush();
    if (runs.length === start) runs.push({ text: ' ', options: runOpts(o) });
    if (li < lines.length - 1) runs[runs.length - 1].options.breakLine = true;
  });
  return runs;
}
function objToPptx(pptx, s, o) {
  if (o.visible === false) return;
  const box = boxOf(o);
  if (isText(o)) {
    s.addText(textRuns(o), { ...box, valign: 'top', align: o.textAlign || 'left', margin: 0, fit: 'none',
      wrap: o.type === 'textbox', lineSpacingMultiple: Math.round((o.lineHeight / 1.16) * 100) / 100 });
    return;
  }
  const SHAPES = { rect: x => x.rx > 0 ? pptx.ShapeType.roundRect : pptx.ShapeType.rect, ellipse: () => pptx.ShapeType.ellipse, circle: () => pptx.ShapeType.ellipse, triangle: () => pptx.ShapeType.triangle };
  if (SHAPES[o.type] && (!o.fill || typeof o.fill === 'string')) {
    const opt = { ...box };
    if (o.fill && o.fill !== 'transparent') { const f = hexA(o.fill); opt.fill = { color: f.color, transparency: Math.round((1 - f.alpha * o.opacity) * 100) }; }
    else opt.fill = { type: 'none' };
    if (o.stroke && o.strokeWidth) opt.line = { color: hexA(o.stroke).color, width: o.strokeWidth * 0.75 }; else opt.line = { type: 'none' };
    s.addShape(SHAPES[o.type](o), opt); return;
  }
  if (o.type === 'image') { s.addImage({ data: imgSrc(o), ...box, flipH: !!o.flipX, flipV: !!o.flipY }); return; }
  // ดาว, เส้น, เส้นที่วาดด้วยปากกา, กลุ่ม → ส่งออกเป็นรูปภาพ
  const b = o.getBoundingRect(true, true);
  s.addImage({ data: o.toDataURL({ format: 'png', multiplier: 2 }), x: b.left * PX2IN, y: b.top * PX2IN, w: b.width * PX2IN, h: b.height * PX2IN });
}
async function exportPPTX() {
  const pptx = new PptxGenJS();
  pptx.defineLayout({ name: 'SS', width: W * PX2IN, height: H * PX2IN }); pptx.layout = 'SS';
  pptx.title = $('#docTitle').value;
  for (let i = 0; i < slides.length; i++) {
    $('#loadingText').textContent = `กำลังส่งออกสไลด์ ${i + 1}/${slides.length}`;
    const s = pptx.addSlide();
    await withStatic(slides[i].json, async sc => {
      if (typeof sc.backgroundColor === 'string' && sc.backgroundColor) s.background = { color: hexA(sc.backgroundColor).color };
      if (sc.backgroundImage) {
        const bi = sc.backgroundImage, bb = bi.getBoundingRect(true, true);
        s.addImage({ data: imgSrc(bi), x: bb.left * PX2IN, y: bb.top * PX2IN, w: bb.width * PX2IN, h: bb.height * PX2IN });
      }
      for (const o of sc.getObjects()) { try { objToPptx(pptx, s, o); } catch (e) { console.warn(e); } }
    });
  }
  saveBlob(await pptx.write({ outputType: 'blob' }), docName() + '.pptx');
}
async function exportPDF() {
  const { jsPDF } = window.jspdf, ori = W >= H ? 'landscape' : 'portrait';
  const pdf = new jsPDF({ orientation: ori, unit: 'px', format: [W, H], hotfixes: ['px_scaling'] });
  for (let i = 0; i < slides.length; i++) {
    $('#loadingText').textContent = `กำลังสร้าง PDF หน้า ${i + 1}/${slides.length}`;
    if (i) pdf.addPage([W, H], ori);
    pdf.addImage(await renderJSON(slides[i].json, 2, 'jpeg'), 'JPEG', 0, 0, W, H);
  }
  saveBlob(pdf.output('blob'), docName() + '.pdf');
}
async function exportAs(kind) {
  closeMenus();
  saveCurrent(); canvas.discardActiveObject(); canvas.requestRenderAll(); updateProps();
  try {
    if (kind === 'json') return downloadProject();
    if (kind === 'png') return download(canvas.toDataURL({ format: 'png', multiplier: 2 / zoom }), `${docName()}-slide${cur + 1}.png`);
    showLoading('กำลังส่งออก...');
    if (kind === 'pdf') await exportPDF(); else await exportPPTX();
  } catch (err) { console.error(err); alert('ส่งออกไม่สำเร็จ: ' + (err.message || err)); }
  finally { hideLoading(); }
}

/* ===================== PRESENT ===================== */
let pIdx = 0, pImgs = [];
async function present() {
  if (penOn) setPen(false);
  saveCurrent(); showLoading('กำลังเตรียมการนำเสนอ...');
  pImgs = []; for (const s of slides) pImgs.push(await renderJSON(s.json, 2, 'jpeg'));
  hideLoading(); pIdx = cur; $('#present').style.display = 'flex'; showP();
  document.documentElement.requestFullscreen?.().catch(() => {});
}
function showP() { $('#presentImg').src = pImgs[pIdx]; $('#presentCounter').textContent = `${pIdx + 1} / ${pImgs.length}`; }
function exitPresent() { $('#present').style.display = 'none'; if (document.fullscreenElement) document.exitFullscreen(); }
function presentKey(e) {
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(e.key)) { pIdx = Math.min(pIdx + 1, pImgs.length - 1); showP(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { pIdx = Math.max(pIdx - 1, 0); showP(); }
  else if (e.key === 'Escape') exitPresent();
  e.preventDefault();
}
$('#present').onclick = () => { if (pIdx < pImgs.length - 1) { pIdx++; showP(); } else exitPresent(); };
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) $('#present').style.display = 'none'; });

/* ===================== UI BINDINGS ===================== */
const closeMenus = () => document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
document.addEventListener('click', closeMenus);

document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => addObj(ADD[b.dataset.add]()));
$('#btnImage').onclick = () => $('#imgInput').click();
$('#imgInput').onchange = e => { [...e.target.files].forEach(addImageFile); e.target.value = ''; };

// QR Code
$('#btnQR').onclick = () => { $('#qrModal').style.display = 'flex'; $('#qrInput').focus(); };
$('#qrCancel').onclick = () => { $('#qrModal').style.display = 'none'; $('#qrInput').value = ''; };
$('#qrSubmit').onclick = () => {
  const val = $('#qrInput').value.trim();
  if (val) { addQRCode(val); $('#qrModal').style.display = 'none'; $('#qrInput').value = ''; }
};
$('#qrInput').onkeydown = e => { if (e.key === 'Enter') $('#qrSubmit').click(); };

// ขนาดสไลด์
$('#btnSize').onclick = e => {
  e.stopPropagation();
  const dd = $('#sizeDD'), willOpen = !dd.classList.contains('open');
  closeMenus();
  if (willOpen) { $('#customW').value = W; $('#customH').value = H; dd.classList.add('open'); }
};
$('#sizeDD .menu').onclick = e => e.stopPropagation();
document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => {
  const [w, h] = b.dataset.size.split('x').map(Number);
  closeMenus(); resizeSlides(w, h);
});
$('#swapSize').onclick = () => { const w = $('#customW').value; $('#customW').value = $('#customH').value; $('#customH').value = w; };
$('#applySize').onclick = () => { closeMenus(); resizeSlides(+$('#customW').value, +$('#customH').value); };
['#customW', '#customH'].forEach(id => $(id).onkeydown = e => { if (e.key === 'Enter') $('#applySize').click(); });

// ปากกา
$('#btnPen').onclick = () => setPen(!penOn);
$('#penColor').oninput = e => { if (!penOn) setPen(true); else canvas.freeDrawingBrush.color = e.target.value; };
$('#penWidth').oninput = e => { if (!penOn) setPen(true); else canvas.freeDrawingBrush.width = Math.max(1, +e.target.value || 1); };

// ซ่อน/แสดงแถบข้าง
$('#toggleLeftBtn').onclick = () => {
  const hidden = $('#slides').classList.toggle('hidden');
  $('#toggleLeftBtn').textContent = hidden ? '▶' : '◀';
  setTimeout(fitZoom, 220);
};
$('#toggleRightBtn').onclick = () => {
  const hidden = $('#props').classList.toggle('hidden');
  $('#toggleRightBtn').textContent = hidden ? '◀' : '▶';
  setTimeout(fitZoom, 220);
};

$('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
$('#btnZoomIn').onclick = () => applyZoom(zoom * 1.15);
$('#btnZoomOut').onclick = () => applyZoom(zoom / 1.15);
$('#btnFit').onclick = fitZoom;
$('#addSlide').onclick = addSlide;
$('#btnNew').onclick = () => { if (confirm('สร้างงานใหม่? งานที่ยังไม่บันทึกจะหายไป')) loadProject({ W, H, slides: [blankJSON()] }, 'งานนำเสนอไม่มีชื่อ'); };
$('#fileOpen').onchange = e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; };
$('#btnSave').onclick = saveProject;
$('#btnPresent').onclick = present;
$('#btnExport').onclick = e => {
  e.stopPropagation();
  const dd = $('#exportDD'), willOpen = !dd.classList.contains('open');
  closeMenus(); if (willOpen) dd.classList.add('open');
};
document.querySelectorAll('[data-exp]').forEach(b => b.onclick = () => exportAs(b.dataset.exp));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); [...(e.dataTransfer.files || [])].forEach(openFile); });

document.addEventListener('keydown', e => {
  if ($('#present').style.display === 'flex') return presentKey(e);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveProject(); return; }
  if (e.key === 'Escape') { closeMenus(); if (penOn) { setPen(false); return; } }
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  const o = canvas.getActiveObject(); if (o && o.isEditing) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && k === 'y') { e.preventDefault(); redo(); }
  else if (mod && k === 'c') copy();
  else if (mod && k === 'v') paste();
  else if (mod && k === 'd') { e.preventDefault(); duplicate(); }
  else if ((k === 'delete' || k === 'backspace') && o) { e.preventDefault(); deleteSelected(); }
  else if (k.startsWith('arrow') && o) {
    e.preventDefault(); const st = e.shiftKey ? 10 : 1;
    o.set({ left: o.left + (k === 'arrowleft' ? -st : k === 'arrowright' ? st : 0), top: o.top + (k === 'arrowup' ? -st : k === 'arrowdown' ? st : 0) });
    o.setCoords(); canvas.requestRenderAll(); commit();
  }
});

/* ===================== INIT ===================== */
(async function init() {
  try { await Promise.all(['Sarabun', 'Prompt', 'Kanit', 'Noto Sans Thai'].map(f => document.fonts.load(`16px "${f}"`))); } catch {}
  slides = [{ json: blankJSON(), thumb: '' }];
  setSize(W, H); await gotoSlide(0, true); updateThumb();
  document.fonts.ready.then(() => { fabric.util.clearFabricFontCache(); canvas.getObjects().forEach(o => o.initDimensions && o.initDimensions()); canvas.requestRenderAll(); });
  $('#docTitle').addEventListener('input', () => { dirty = true; });

  let inFrame = false; try { inFrame = window.self !== window.top; } catch { inFrame = true; }
  if (inFrame) toast('แอปกำลังรันในหน้าพรีวิว/iframe ซึ่งมักบล็อกการดาวน์โหลด แนะนำให้เปิดไฟล์ .html ในเบราว์เซอร์โดยตรง', null, 15000);

  try {
    const saved = await idb('readonly', s => s.get('autosave'));
    if (saved && saved.slides?.length &&
        confirm(`พบงาน "${saved.title}" ที่บันทึกไว้เมื่อ ${new Date(saved.savedAt).toLocaleString('th-TH')}\nเปิดต่อไหม?`)) {
      showLoading('กำลังเปิดงานที่บันทึกไว้...');
      await loadProject(saved, saved.title);
      hideLoading(); dirty = false;
    }
  } catch (e) { console.warn('ไม่สามารถใช้ autosave', e); }
})();
</script>
